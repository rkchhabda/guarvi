services:
  - type: web
    name: guarvi-portal
    runtime: docker  # Changed from 'python' to 'docker'
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    # No buildCommand needed for Docker; it runs the Dockerfile automatically
    startCommand: "" 
    healthCheckPath: "/api/now"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUARVI_DATA_DIR
        value: "./data"
      - key: GUARVI_REPORTS_DIR
        value: "./reports"
