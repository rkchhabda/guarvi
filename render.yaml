services:
  - type: web
    name: guarvi-portal
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: "pip install --upgrade pip && pip install --only-binary=:all: -r requirements-render.txt"
    startCommand: "uvicorn web.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: "/api/now"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUARVI_DATA_DIR
        value: "./data"
      - key: GUARVI_REPORTS_DIR
        value: "./reports"
