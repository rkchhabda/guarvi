services:
  - type: web
    name: guarvi-portal
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: "/api/now"
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUARVI_DATA_DIR
        value: "./data"
      - key: GUARVI_REPORTS_DIR
        value: "./reports"
